<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidal menu</title><style>
:root{--a:#b80eab;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f1e9f7;overflow:hidden}
#box{position:relative;width:100%;height:100%}
#st{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#1a1026,#0d0916);border:1px solid color-mix(in srgb,var(--a) 45%,transparent);user-select:none}
.sb{position:absolute;left:0;top:0;bottom:0;width:200px;padding:22px 16px;background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:6px}
.lg{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;color:var(--a);margin-bottom:22px}.lg svg{width:36px;height:36px}
.nv{padding:10px 14px;border-radius:12px;cursor:pointer;font-size:16px;color:#d9cfe6}.nv:hover{background:rgba(255,255,255,.06)}.nv.on{background:color-mix(in srgb,var(--a) 35%,transparent);color:#fff;font-weight:600}
.sp{flex:1}.cnt{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:14px}.cnt b{color:var(--a);font-size:18px}.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:6px}.bar i{display:block;height:100%;border-radius:2px;background:var(--a);transition:width .2s}
.eh{margin-top:8px;padding:10px;text-align:center;border-radius:12px;background:color-mix(in srgb,var(--a) 55%,#000);cursor:pointer;font-weight:600}.eh:hover{filter:brightness(1.2)}
.us{margin-top:6px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px;display:flex;gap:8px;align-items:center}.us i{width:22px;height:22px;border-radius:5px;background:#b8743f}
.mn{position:absolute;left:200px;right:0;top:0;bottom:0;padding:22px 28px;overflow:hidden}
.tp{display:flex;gap:14px;align-items:center;margin-bottom:18px}.tp input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px}.tp input::placeholder{color:#8f84a0}
.ch{padding:5px 14px;border-radius:99px;border:1px solid var(--a);background:color-mix(in srgb,var(--a) 25%,transparent);font-size:14px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer}.md:hover{background:rgba(255,255,255,.07)}
.md.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}
.ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:18px}
.tx{flex:1}.tx b{display:block;font-size:15px}.tx span{font-size:12.5px;color:#a89cb8}
.tg{width:44px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.15s}.tg:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#efe9a8;transition:.15s}.on .tg{background:var(--a)}.on .tg:after{left:25px}
.st{font-size:10px;text-align:center;color:#8f84a0;margin-top:2px}
h2{font-size:22px;margin-bottom:16px}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.pv div{height:120px;border-radius:10px;border:1px solid color-mix(in srgb,var(--a) 60%,#fff 10%);position:relative;overflow:hidden;background:#150d20}
.pv small{position:absolute;bottom:-1px;left:0;right:0;text-align:center;padding:3px;font-size:12px;background:#0d0916}
.m1{background:linear-gradient(#5b6bd8,#e9c2dd 55%,var(--a) 56%)!important}.m1:before{content:"";position:absolute;left:30%;right:30%;top:36%;height:26px;background:repeating-linear-gradient(#fff9,#fff9 3px,transparent 3px,#fff0 6px)}
.m2:before,.m3:before{content:"";position:absolute;inset:14px 30px 30px;background:repeating-linear-gradient(transparent 0 8px,color-mix(in srgb,var(--a) 70%,#fff) 8px 10px);border-radius:4px}.m3:before{inset:14px 12px 30px;background:repeating-linear-gradient(90deg,transparent 0 40px,#fff2 40px 42px),repeating-linear-gradient(transparent 0 34px,#fff2 34px 36px)}
.ap{display:flex;gap:26px;align-items:flex-start}.wh{width:170px;height:170px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;cursor:crosshair;flex:none}.wh:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff,#fff0 70%)}
.sw{display:flex;gap:10px;margin:8px 0 14px}.sw i{width:34px;height:34px;border-radius:8px;cursor:pointer;border:2px solid transparent}.sw i:hover{border-color:#fff}
.hx{font-weight:600;font-size:16px}.hx i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--a);vertical-align:-2px;margin-right:6px}
.rs{margin-top:16px;display:inline-block;padding:6px 18px;border:1px solid #fff6;border-radius:99px;cursor:pointer;font-size:14px}
.cs{display:grid;place-items:center;height:400px;text-align:center;color:#a89cb8}.cs b{font-size:22px;color:#fff;display:block;margin-bottom:6px}
#hud{position:absolute;inset:0;background:linear-gradient(#10182e,#1b2b3d 60%,#1d3b2a 60%);display:none}#hud.on{display:block}
#hud .t{position:absolute;top:18px;left:0;right:0;text-align:center}#hud .t b{font-size:20px}#hud .t p{font-size:14px;color:#c6bfd6;margin:2px 0 8px}
.dn{display:inline-block;padding:8px 36px;border-radius:8px;background:var(--a);cursor:pointer;font-weight:600}
.w{position:absolute;padding:8px 12px;border-radius:9px;background:rgba(0,0,0,.5);border:1px dashed #fff8;cursor:grab;font-size:14px;touch-action:none}.w:active{cursor:grabbing}
.k{display:inline-grid;place-items:center;width:30px;height:30px;margin:2px;border-radius:6px;background:#fff2;font-size:13px}
</style></head><body><div id="box"><div id="st">
<div class="sb"><div class="lg"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M10 32C8 18 22 8 38 12C27 13 20 21 22 30C24 38 33 40 40 35"/></svg>Tidal</div><div id="nv"></div><div class="sp"></div>
<div class="cnt"><b id="n">9</b> of 37 on<div class="bar"><i id="br"></i></div></div><div class="eh" id="eh">Edit HUD</div><div class="us"><i></i>jkpolllll</div></div>
<div class="mn" id="mn"></div>
<div id="hud"><div class="t"><b>Edit HUD</b><p>Drag any widget to move it. Esc goes back.</p><span class="dn" id="dn">Done</span></div></div>
</div></div><script>
var $=function(i){return document.getElementById(i)},st=$('st'),sc=1,page='modules',q='';
var M=[['Fullbright','See in the dark.','☀',0],['Keystrokes','WASD and mouse keys.','⌨',1],['Spotify','Shows your Spotify song.','♫',0],['Server Info','Server name and IP.','▤',0],['FPS Counter','Your FPS.','◔',1],['CPS Counter','Clicks per second.','➤',0],['Coordinates','Your X, Y, Z.','⌖',0],['Armor Status','Armor and durability.','⛨',0],['Compass','Shows which way you face.','◎',0],['Zoom','Hold C to zoom.','⌕',1],['Toggle Sprint','Auto-sprint while walking.','»',0],['Punch Speed','Faster or slower punch swing.','⚡',1]];
var BASE=5,COLS=['#5ee0d6','#5ed6d0','#6fe39a','#f2d03b','#f5a742','#f2665f','#ee8fc7','#c3a7ef'];
function fit(){sc=Math.min(innerWidth/960,innerHeight/600);st.style.transform='scale('+sc+')'}addEventListener('resize',fit);fit();
function setA(c){document.documentElement.style.setProperty('--a',c);if(page==='appearance')$('hx').innerHTML='<i></i>'+c.toUpperCase()}
function cnt(){var n=BASE+M.filter(function(m){return m[3]}).length;$('n').textContent=n;$('br').style.width=n/37*100+'%'}
function nav(){var h='';['modules','settings','social','locker','appearance'].forEach(function(p){h+='<div class="nv'+(p===page?' on':'')+'" data-p="'+p+'">'+p[0].toUpperCase()+p.slice(1)+'</div>'});$('nv').innerHTML=h}
function draw(){nav();var h='';
if(page==='modules'){h='<div class="tp"><input id="sq" placeholder="Search modules..." value="'+q+'"><span class="ch">All 37</span></div><div class="gr">';
M.forEach(function(m,i){if(m[0].toLowerCase().indexOf(q.toLowerCase())<0)return;h+='<div class="md'+(m[3]?' on':'')+'" data-i="'+i+'"><div class="ic">'+m[2]+'</div><div class="tx"><b>'+m[0]+'</b><span>'+m[1]+'</span></div><div><div class="tg"></div><div class="st">'+(m[3]?'ON':'OFF')+'</div></div></div>'});h+='</div>'}
else if(page==='appearance'){h='<h2>Appearance</h2><div class="pv"><div class="m1"><small>Main menu</small></div><div class="m2"><small>Pause menu</small></div><div class="m3"><small>Mod menu</small></div></div><div class="ap"><div class="wh" id="wh"></div><div><b>Gradient theme</b><div style="font-size:13px;color:#a89cb8">One colour for logo, waves, sea, beach</div><div class="sw">'+COLS.map(function(c){return'<i style="background:'+c+'" data-c="'+c+'"></i>'}).join('')+'</div><div class="hx" id="hx"><i></i>'+getComputedStyle(document.documentElement).getPropertyValue('--a').trim().toUpperCase()+'</div><span class="rs" id="rs">Reset</span></div></div>'}
else if(page==='social')h='<div class="cs"><div><b>Coming soon</b>Friends and social are on the way.</div></div>';
else h='<div class="cs"><div><b>'+page[0].toUpperCase()+page.slice(1)+'</b>Not part of this preview.</div></div>';
$('mn').innerHTML=h;cnt()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-p],[data-i],[data-c]');
if(t&&t.dataset.p){page=t.dataset.p;draw()}else if(t&&t.dataset.i){M[t.dataset.i][3]^=1;draw()}else if(t&&t.dataset.c)setA(t.dataset.c);
if(e.target.id==='rs')setA('#b80eab');if(e.target.id==='eh')hud(1);if(e.target.id==='dn')hud(0);
if(e.target.id==='wh'){var r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,hu=(Math.atan2(y,x)*180/Math.PI+360)%360,d=Math.min(1,Math.hypot(x,y)*2);setA('hsl('+Math.round(hu)+' '+Math.round(d*100)+'% 55%)')}});
document.addEventListener('input',function(e){if(e.target.id==='sq'){q=e.target.value;var p=e.target.selectionStart;draw();var s=$('sq');s.focus();s.setSelectionRange(p,p)}});
addEventListener('keydown',function(e){if(e.key==='Escape')hud(0)});
var P={'FPS Counter':[40,150,'144 FPS'],'Keystrokes':[40,230,'<span class="k">W</span><br><span class="k">A</span><span class="k">S</span><span class="k">D</span>'],'Coordinates':[760,150,'X 128 Y 64 Z -42'],'CPS Counter':[760,200,'8 CPS'],'Armor Status':[760,250,'⛨ 100%'],'Compass':[420,150,'N ◎ NE'],'Zoom':[420,200,'Zoom 30°'],'Toggle Sprint':[420,250,'Sprinting'],'Punch Speed':[420,300,'Punch ×1.5'],'Server Info':[40,380,'play.example.net'],'Spotify':[40,430,'♫ Now playing'],'Fullbright':[760,300,'Fullbright']};
function hud(on){var el=$('hud');el.classList.toggle('on',!!on);if(!on)return;el.querySelectorAll('.w').forEach(function(w){w.remove()});
M.forEach(function(m){if(!m[3]||!P[m[0]])return;var d=document.createElement('div'),p=P[m[0]];d.className='w';d.style.left=p[0]+'px';d.style.top=p[1]+'px';d.innerHTML=p[2];el.appendChild(d);
d.addEventListener('pointerdown',function(e){var sx=e.clientX,sy=e.clientY,ox=d.offsetLeft,oy=d.offsetTop;d.setPointerCapture(e.pointerId);
d.onpointermove=function(v){d.style.left=Math.max(0,Math.min(960-d.offsetWidth,ox+(v.clientX-sx)/sc))+'px';d.style.top=Math.max(0,Math.min(600-d.offsetHeight,oy+(v.clientY-sy)/sc))+'px'};d.onpointerup=function(){d.onpointermove=null}})})}
draw();
</script></body></html>
